name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv lock --check
      - run: python3 .github/scripts/changelog.py
      - run: uv audit --preview-features audit
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run tach check
      - run: uv run tach check-external

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: ./test.sh
      - uses: codecov/codecov-action@v7
        with:
          files: reports/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: reports/
